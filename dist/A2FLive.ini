; A2F Live settings. All can also be changed in game: SKSE Menu Framework -> A2F Live -> Settings (then "Save to A2FLive.ini").
; Missing keys use the defaults built into A2FLive/A2FLive.dat.

[General]
; 0 = off: the model is not loaded. In game, unticking "Enabled" shows vanilla lip-sync instantly (A/B).
Enabled=1
; 1 = DirectML on the GPU (~85 MB VRAM, ~40x realtime). 0 = CPU only (no VRAM, slower; long lines start late).
GPU=1
; network file in Data/SKSE/Plugins/A2FLive/
Model=network_fp16.onnx
; audio windows per network run. 2 = least VRAM; higher is a little faster and uses more
Batch=2
; free the model's VRAM after this many seconds without dialogue (0 = keep resident; reload costs ~0.3 s on the next line)
UnloadAfterIdleSeconds=0
; start generating when a dialogue response is created, before the actor speaks
Prefetch=1
; generated lines kept in memory (~1 KB per second of audio)
CacheLines=300

[Playback]
MouthStrength=1
BrowStrength=1
ExpressionStrength=1
; seconds; positive = mouth shapes earlier
TimeOffset=0
; crossfade (s) from vanilla lip-sync when a line finished generating after it started
BlendIn=0.15

[Generation]
; Overrides for the built-in tuning; applies to newly generated lines. "Save to A2FLive.ini" in the menu writes all of them.
; Keys: Strength Smooth Ridge FeatureWeight InputStrength SkinStrength LowerFaceStrength UpperFaceStrength
;       LowerFaceSmoothing UpperFaceSmoothing TongueStrength TongueShare EmotionFloor EmotionGain EmotionCap
;       ExpressionFloor ExpressionGain Emphasis EmotionOnset EmotionAttack EmotionRelease
;       EmotionToA2F Expression Tongue (0/1)
;Strength=1.3

[Direct]
; deform the face mesh directly from Audio2Face (needs A2FLive/A2FDirect.bin); per-region scales 0..2
DirectMode=0
;DirectBrows=0.5
;DirectEyes=0.3
;DirectCheeks=0.4
;DirectMouth=1.3
;DirectJaw=1.3
;DirectTongue=1.3

[Channels]
; optional per-morph overrides: Name=gain offset gamma max cost solve(0|1)
;Aah=1 0 1 1 1 1

[Debug]
; lines written to A2FLive.log (SKSE log folder)
LogLines=40
