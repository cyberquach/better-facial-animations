; Better Facial Animations settings. All can also be changed in game: SKSE Menu Framework -> Better Facial Animations -> Settings (saved automatically).
; Missing keys use the built-in defaults, which are the values below.

[General]
; file layout: upgrades reset changed local-strength tuning and preserve other settings
IniVersion=3
; 0 = off: the model is not loaded. In game, unticking "Enabled" shows vanilla lip-sync instantly (A/B).
Enabled=1
; Animate player dialogue with DBReV 1.4.4+. 0 keeps native player lip-sync; NPCs are unaffected.
PlayerFacialAnimations=1
; 0 = DirectML on the GPU (~250 MB VRAM; ~100 MB with UseOldModel=1). 1 = CPU only: the model is never loaded into
; VRAM (slower; long lines start late). Read at startup: restart the game after changing it.
; On the GPU the model is loaded at the main menu and its VRAM is kept until the game exits. If the GPU cannot load it
; (or loses it), the reason is shown in the settings window, the GPU is retried and lines run on the CPU meanwhile (slow).
ForceCPU=0
; the Audio2Face-3D model. 0 = v3.0 (a2f3_fp16.onnx, A2FDirect3.bin): ~250 MB of VRAM, more expressive, faster to
; inference; women speak with Claire's face, men with Mark's, at 60 frames per second. 1 = the old model, v2.3
; (network_fp16.onnx, A2FDirect.bin): ~100 MB of VRAM, less expressive, slower to inference; everyone with Mark's, at 30.
; Every head is fitted to the face it speaks with either way. Read at startup: restart the game after changing it.
UseOldModel=0
; UseOldModel=1 only: audio windows per network run. 2 = least VRAM; higher is a little faster and uses more
Batch=2
; start generating when a dialogue response is created, before the actor speaks
Prefetch=1
; generated lines kept in memory (~9 KB per second of audio)
CacheLines=300

[Playback]
; seconds; positive = mouth shapes earlier
TimeOffset=0
; crossfade (s) from vanilla lip-sync when a line finished generating after it started
BlendIn=0.15

[LocalAnimationStrength]
; per-region face deformation scales 0..3, on top of the fit to each head (a head made for smaller facial motion,
; e.g. UBE, takes the speech scaled down to match)
DirectBrows=1
DirectEyes=1
DirectCheeks=1
; 1 = original strength, or 0.85 when that sex's Expressive Facial Animation is detected
DirectMouth=1
; lower teeth, gums and tongue: how far they move with Audio2Face's jaw
DirectJaw=1
; 1 restores pre-feature tongue mapping and model animation; 0 enables the new tongue blend
DisableTongue=0
; articulation multiplier for all phonemes: 1 = calibrated default, 0 = jaw follow only
DirectTongue=1

[Emotion]
; The emotion settings apply from the next line spoken. Only emotion moves the brows, eyes and cheeks much.
; how strongly a line's emotion (the game's, for the line) drives the Audio2Face face, 0..3: 1 = as given; the game's
; is often only 50 of 100 (the network takes at most 2 x 100)
VoiceEmotion=1
; how much the emotion grows where the voice is loud, 0..2: at the line's loudest it is 1 + this times its base
; strength (0 = steady)
VoiceSwell=0.25
; The game's own expressions (dialogue, mood, combat) fade out while a line plays, when Audio2Face alone shapes the
; face, and back in after it.
; seconds for the game's own expressions to fade out when a line starts (the face goes to Audio2Face), 0..3
FaceFadeIn=0.5
; seconds for them to fade back in after the line, 0..3
FaceFadeOut=1

[Debug]
; BetterFacialAnimations.log (SKSE log folder) always holds the GPU, the driver and any problem loading the model.
; 1 = also write the generated / played lines there; also a checkbox in the menu
Logging=1
; with Logging on: generated / played lines written to the log
LogLines=400
; The wrapper lifetime fix is automatic, including with an older INI.
; Optional troubleshooting: 1 runs DirectML through the wrapper instead of the native device.
; This can cause device loss and CPU fallback on some systems. Restart after changing.
UseDeviceWrapper=0
