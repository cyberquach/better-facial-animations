; Better Facial Animations settings. Most can also be changed in game: SKSE Menu Framework -> Better Facial Animations -> Settings (saved automatically).
; Missing keys use the built-in defaults, which are the values below.

[General]
; file layout: shared slider settings from older INIs seed both sex profiles; Argonians default on since 6
IniVersion=6
; 0 = off: the model is not loaded. In game, unticking "Enabled" shows vanilla lip-sync instantly (A/B).
Enabled=1
; Only process and animate the active conversation NPC and the player (DBReV or DBVO 2). Other NPC speech stays vanilla.
; Both modes keep the model loaded from the main menu until exit; 0 restores all-speaker mode.
PotatoMode=0
; Animate player dialogue with DBReV 1.4.4+ or experimental DBVO 2 support, including in Potato mode.
; 0 keeps native player lip-sync; NPCs are unaffected.
PlayerFacialAnimations=1
; DBReV and DBVO2 are detected automatically; PlayerFacialAnimations controls both.
; 0 = DirectML on the GPU (~250 MB VRAM; ~100 MB with UseOldModel=1). 1 = CPU only: the model is never loaded into
; VRAM (slower; long lines start late). Menu changes apply live; manual INI edits are read at startup.
; The model is loaded at the main menu and kept until exit. If the GPU cannot load it
; (or loses it), the settings window shows why; it is retried and lines use the CPU meanwhile (slower).
ForceCPU=0
; All three models use the GPU unless ForceCPU=1, with CPU fallback on GPU failure.
; Experimental in-process isolation for ReShade/RenoDX/frame-generation conflicts. Restart after changing.
; 1 requires an independent D3D12 device and private compute queue; failure uses CPU, never the shared GPU device.
; Requires supporting Windows D3D12 runtime and driver. UseDeviceWrapper is ignored; metacommands stay on.
; No helper EXE. Not a guarantee against hook/driver hangs. 0 preserves the existing GPU path.
IndependentGpuDevice=0
; 0 = Audio2Face v3.0: the most expressive model, with detailed lip syncing at 60 fps.
; Roughly 2x as fast as the Old model in RTX 4070 GPU tests; about 250 MB of VRAM. Women use Claire, men use Mark.
; 1 = Audio2Face v2.3: less expressive than V3 and roughly half V3's speed in RTX 4070 GPU tests; about 100 MB VRAM.
; Speed varies by system and dialogue. Old uses one shared facial identity at 30 fps. Every head is fitted either way.
; Menu changes apply live; already playing lines finish with their current animation. Manual INI edits are read at startup.
UseOldModel=0
; One model is selected: V3 unless UseOldModel or UsePerformanceModel is 1 (Performance wins when both are).
; Smaller model distilled from V3's output on Skyrim's dialogue. Fastest to run: roughly 8x as fast as V3 in RTX 4070
; GPU tests. Less expressive and less accurate at lip syncing; lip syncing on modded dialogue may be degraded. Runs at 30 fps and does not support the eye gaze feature.
; About 80 MB of VRAM on GPU. Speed and VRAM usage vary by system and dialogue. Menu changes apply live.
UsePerformanceModel=0
; UseOldModel=1 only: audio windows per network run. 2 = least VRAM; higher is a little faster and uses more
Batch=2
; start generating when a dialogue response is created, before the actor speaks
Prefetch=1
; generated lines kept in memory (~9 KB per second of audio)
CacheLines=300

[LocalAnimationStrength]
; both sexes: 1 restores pre-feature tongue mapping and model animation; 0 enables the new tongue blend
DisableTongue=0
; SE/AE eye motion while the speaking conversation NPC looks at the player.
ConversationGaze=1
; 0..2; 0 keeps the game's gaze, 1 is the default strength.
GazeStrength=1

[PlaybackMale]
; seconds; positive = mouth shapes earlier
TimeOffset=0
; crossfade (s) from vanilla lip-sync when a line finished generating after it started
BlendIn=0.15

[LocalAnimationStrengthMale]
; per-region face deformation scales 0..3, on top of the fit to each head (a head made for smaller facial motion,
; e.g. UBE, takes the speech scaled down to match)
DirectBrows=1
DirectEyes=1
DirectCheeks=1
; 1 = original strength, or 0.85 when that sex's Expressive Facial Animation is detected
DirectMouth=1
; lip movement multipliers on top of DirectMouth; 1 = default
; UpperLip and LowerLip range 0..3
UpperLip=1
LowerLip=1
; lower teeth and gums: how far they move with Audio2Face's jaw
DirectJaw=1
; articulation multiplier for all phonemes: 1 = calibrated default, 0 = jaw follow only
DirectTongue=1

[EmotionMale]
; The emotion settings apply from the next line spoken. Only emotion moves the brows, eyes and cheeks much.
; how strongly a line's emotion (the game's, for the line) drives the Audio2Face face, 0..3: 1 = as given; the game's
; is often only 50 of 100 (the network takes at most 2 x 100)
VoiceEmotion=1
; Per-model-channel caps after strength and volume swell, 0..2: 0 = off, 1 = full game intensity,
; 2 = original limit. Lower MaxJoy to soften smiles. Applies from the next line; lip-sync remains active.
; Grief, OutOfBreath and Pain are not fed by the current Skyrim emotion mapping.
MaxAmazement=2
MaxAnger=2
MaxCheekiness=2
MaxDisgust=2
MaxFear=2
MaxGrief=2
MaxJoy=2
MaxOutOfBreath=2
MaxPain=2
MaxSadness=2
; how much the emotion grows where the voice is loud, 0..2: at the line's loudest it is 1 + this times its base
; strength (0 = steady)
VoiceSwell=0.25
; The game's own expressions (dialogue, mood, combat) fade out while a line plays, when Audio2Face alone shapes the
; face, and back in after it.
; seconds for the game's own expressions to fade out when a line starts (the face goes to Audio2Face), 0..3
FaceFadeIn=0.5
; seconds for them to fade back in after the line, 0..3
FaceFadeOut=1

