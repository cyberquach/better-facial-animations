[Debug]
; BetterFacialAnimations.log (SKSE log folder) always holds the GPU, the driver and any problem loading the model.
; 1 = also write the generated / played lines there; also a checkbox in the menu
Logging=1
; with Logging on: generated / played lines written to the log
LogLines=400

; Races whose checkbox differs from its default (see the Races menu page), as source plugin|local form id
; so load order does not matter. 1 applies BFA; 0 keeps vanilla.
[Races]

; Per-NPC overrides, across saves and copies of the same base. Missing plugins retain entries.
; The Overrides menu manages these; global Defaults preserves them. Manual edits require restart.
; Index: source plugin|six-digit hexadecimal local NPC base ID=1 (light IDs padded to six).
; Example (uncomment all desired lines):
[Overrides]
; Follower.esp|001234=1

; [Override:Follower.esp|001234]
; Enabled=1
; DirectMouth=0.8
; SmileEyes=1.2
; VoiceEmotion=0.5
; SentimentAnalysis=0
; SentimentMultiplier=0.5
; MaxJoy=0.4
; Any Playback/LocalAnimationStrength/Emotion profile key can be set here, plus
; DisableTongue, ConversationGaze, GazeStrength, SentimentAnalysis and SentimentMultiplier (0-2).
; SentimentAnalysis=0 disables Sentiment Analysis for this NPC; 1 follows the global switch.
; SentimentMultiplier requires Sentiment Analysis; 0 skips it for this NPC.
; Omitted keys inherit global settings.
; Enabled=0 keeps vanilla animation. Global enable and race restrictions still apply.
